<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뚝딱파킹 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        header img {
            height: 30px;
        }
        form {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            width: 48%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-login {
            background-color: #8b5e57;
            color: white;
        }
        .btn-signup {
            background-color: white;
            color: #8b5e57;
            border: 1px solid #8b5e57;
        }
        .social-btn {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        .btn-naver {
            background-color: #03c75a;
        }
        .btn-kakao {
            background-color: #f7e600;
            color: black;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
        
        

    </style>
</head>
<body>
    <main class="container" >
        <header>
            <h1>뚝딱파킹 🚗</h1>
            <button aria-label="사용자 계정">👤</button>
        </header>
        <section>
            <form>
                <div class="form-group" style="align-items: center;">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="이메일을 입력하세요" required style="width: 95%;">
                </div>
                <div class="form-group" style="align-items: center;">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required style="width: 95%;">
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-login">로그인</button>
                    <button type="button" class="btn btn-signup">회원가입</button>
                </div>
            </form>
        </section>
        <section>
            <button class="social-btn btn-naver">Naver</button>
            <button class="social-btn btn-kakao">Kakao</button>
        </section>
        <footer>
            <p>&copy; 2024 뚝딱파킹. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
