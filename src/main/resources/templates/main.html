<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>뚝딱 파킹</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    .header {
      width: 100%;
      padding: 20px 25px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      background-color: #fff;
    }


    .header .title {
      width: 100%; /* 부모 요소에 꽉 차도록 설정 */
      display: flex;
      justify-content: space-between; /* 양쪽 끝으로 배치 */
      align-items: center; /* 세로 중앙 정렬 */
      padding: 0 15px; /* 좌우 패딩 추가 (필요시) */
      font-size: 1.4em; /* 기본 글씨 크기 */
    }
    
    .logo {
      font-weight:bolder; /* 왼쪽 텍스트 강조 */
    }
    .header .title span {
      margin-left: 5px;
    }

    .header .user-icon {
      font-size: 1.2em;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px;
      border-radius: 20px;
      background-color: #fff;
    }

    .card-blue {
      margin-top: 40%;
      background-color: #EFF6FF;
    }

    .card-green {
      background-color: #F0FDF4;
    }

    .card h3 {
      margin: 0 0 10px 0;
      font-size: 1.2em;
    }

    .card p {
      margin: 0 0 15px 0;
      font-size: 0.9em;
      color: grey;
    }

    .card button {
      width: 90%;
      padding: 10px 10px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
    }

    .card-blue button {
      background-color: #2563EB;
      color: white;
      border-radius: 10px;
    }

    .card-green button {
      background-color: #16A34A;
      color: white;
      border-radius: 10px;
    } 

    .card button:hover {
      opacity: 0.9;
    }

   
    
  </style>
</head>
<body>
<div class="header">
  <div class="title">
    <span class="logo">뚝딱파킹 🚗</span>
    <span class="user-icon">👤</span>
  </div>
</div>

<div class="container">
  <div class="card card-blue">
    <h3>주차권 구매</h3>
    <p>새로운 주차권을 구매하세요</p>
    <button onclick="location.href='/ttukttak-parking/search'" class="select-btn">바로 구매하기</button>
  </div>

  <div class="card card-green">
    <h3>주차권 확인</h3>
    <p>구매한 주차권을 확인하세요</p>
    <button class="select-btn">바로 확인하기</button>
  </div>
</div>

</body>
</html>
